version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hmis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hmis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hmis_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-hmis_db}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - hmis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hmis_user} -d ${POSTGRES_DB:-hmis_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hmis_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - hmis_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hmis_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hmis_user}:${POSTGRES_PASSWORD:-hmis_secure_password_2026}@postgres:5432/${POSTGRES_DB:-hmis_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-hospital_management_jwt_super_secret_key_2026_x89}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-hospital_management_jwt_refresh_super_secret_key_2026_y90}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hmis_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    depends_on:
      - backend

volumes:
  hmis_postgres_data:
  hmis_redis_data:
